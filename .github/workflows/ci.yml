name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install analysis dependencies
        run: pip install -r analysis/requirements.txt

      - name: Make scripts executable
        run: chmod +x bench.sh entropy/*.sh lib/*.sh tests/*.sh

      - name: Run harness tests
        run: make test-harness

      - name: Run entropy tests
        run: make test-entropy

      - name: Run staleness tests
        run: make test-staleness

      - name: Run token accounting tests
        run: make test-tokens

      - name: Run statistical analysis tests
        run: make test-analysis

      - name: Run duplication and composite tests
        run: make test-entropy-advanced

      - name: Validate experiment configs
        run: make validate

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: ShellCheck
        run: |
          sudo apt-get -qq install -y shellcheck
          find . -name '*.sh' -not -path './fixtures/*' -print0 | xargs -0 shellcheck --severity=error || true

      - name: Check prompt identity
        run: |
          for prompt in prompts/*.md; do
            if grep -qi -E '\b(rtmx|rtm[^a-z]|mcp|requirements.traceability)\b' "$prompt" 2>/dev/null; then
              echo "ERROR: $prompt contains RTMX/RTM/MCP references"
              exit 1
            fi
          done
          echo "All prompts pass identity check"
